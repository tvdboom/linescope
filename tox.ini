[tox]
env_list = pre-commit, py{311,312,313,314,315}, py311-min, docs
labels =
    unit = py311, py312, py313, py314, py315
min_coverage = 95

[testenv]
runner = uv-venv-lock-runner
package = wheel
dependency_groups = test
changedir = {envtmpdir}
commands = pytest {posargs:{toxinidir}/tests} -m "not spark and not scalene and not databricks"

[testenv:pre-commit]
package = skip
changedir = {toxinidir}
dependency_groups = pre-commit, lint
# Resolve optional IPython imports; the lint group supplies Databricks stubs.
extras = notebook
pass_env = SKIP
set_env =
    UV_PROJECT_ENVIRONMENT = {envdir}
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:py314]
commands = pytest {posargs:{toxinidir}/tests} -m "not spark and not scalene and not databricks" --cov=linescope --cov-config={toxinidir}/pyproject.toml --cov-report=xml:{toxinidir}/coverage.xml --cov-report=term-missing --cov-fail-under={[tox]min_coverage}

[testenv:py311-min]
runner = uv-venv-runner
base_python = py311
uv_resolution = lowest-direct

[testenv:scalene]
base_python = py311
commands = pytest {toxinidir}/tests -m scalene {posargs}

[testenv:spark]
base_python = py311
extras = spark
pass_env = JAVA_HOME, PATH, SPARK_HOME
set_env =
    LINESCOPE_TEST_SPARK = 1
    PYSPARK_PYTHON = {envpython}
commands = pytest {toxinidir}/tests -m spark {posargs}

[testenv:notebooks]
base_python = py313
extras = notebook, spark
pass_env = JAVA_HOME, PATH, SPARK_HOME
set_env =
    PYSPARK_PYTHON = {envpython}
    SPARK_LOCAL_IP = 127.0.0.1
commands =
    python -m ipykernel install --sys-prefix --name python3
    python -c "import shutil, sys; shutil.copytree(sys.argv[1], 'notebooks', dirs_exist_ok=True)" {toxinidir}/examples/notebooks
    pytest --nbmake --nbmake-timeout=600 {posargs:notebooks}

[testenv:docs]
package = editable
changedir = {toxinidir}
dependency_groups = docs
set_env = PYTHONPATH = {toxinidir}
commands = mkdocs build --strict
