[tox]
env_list = lint, py{311,312,313,314}, py311-min, docs
labels =
    unit = py311, py312, py313, py314
min_coverage = 70

[testenv]
runner = uv-venv-lock-runner
package = wheel
dependency_groups = test
changedir = {envtmpdir}
commands = pytest {posargs:{toxinidir}/tests} -m "not spark and not scalene and not databricks"

[testenv:py314]
commands = pytest {posargs:{toxinidir}/tests} -m "not spark and not scalene and not databricks" --cov=linescope --cov-report=xml:{toxinidir}/coverage.xml --cov-report=term-missing --cov-fail-under={[tox]min_coverage}

[testenv:py311-min]
runner = uv-venv-runner
base_python = py311
uv_resolution = lowest-direct

[testenv:lint]
package = skip
changedir = {toxinidir}
dependency_groups = lint
commands =
    ruff check .
    ruff format --check .
    ty check

[testenv:pre-commit]
package = skip
changedir = {toxinidir}
dependency_groups = pre-commit, lint
pass_env = SKIP
set_env =
    UV_PROJECT_ENVIRONMENT = {envdir}
    UV_NO_SYNC = 1
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:docs]
package = editable
changedir = {toxinidir}
dependency_groups = docs
set_env = PYTHONPATH = {toxinidir}
commands = mkdocs build --strict

[testenv:spark]
base_python = py311
extras = spark
pass_env = JAVA_HOME, PATH, SPARK_HOME
set_env =
    LINESCOPE_TEST_SPARK = 1
    PYSPARK_PYTHON = {envpython}
commands = pytest {toxinidir}/tests -m spark {posargs}

[testenv:scalene]
base_python = py311
extras = scalene
commands = pytest {toxinidir}/tests -m scalene {posargs}
