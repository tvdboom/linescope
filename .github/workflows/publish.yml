name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate tag against pyproject.toml
        run: |
          uv run --no-project python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag and package version differ'
          PY
      - run: uv sync --locked
      - run: uv run --no-sync tox -e pre-commit,py313,notebooks,docs
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  documentation:
    runs-on: ubuntu-latest
    needs: validate-and-build
    environment: github-pages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked --no-default-groups --group docs --group spark --extra notebook
      - run: uv run --no-sync python -m ipykernel install --sys-prefix --name python3
      - name: Deploy versioned Material documentation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          uv run --no-sync mike deploy --push --update-aliases "${GITHUB_REF_NAME%.*}" latest
          uv run --no-sync mike set-default --push latest

  publish:
    runs-on: ubuntu-latest
    needs: validate-and-build
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always dist/*
