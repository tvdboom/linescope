[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[project]
name = "linescope"
version = "0.1.0"
description = "A refreshingly simple source profiler for Python and Spark"
authors = [{name = "Mavs", email = "m.524687@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.16"
keywords = ["profiling", "source", "notebooks", "spark", "scalene"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Debuggers",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.4.2",
    "psutil>=5.9",
    "scalene>=2.3,<2.4; python_version < '3.15'",
]

[project.optional-dependencies]
notebook = ["ipython>=8.20", "ipykernel>=6.29"]
databricks = ["linescope[notebook]", "databricks-sdk"]
spark = ["pyspark>=3.5"]
full = ["linescope[notebook,spark,databricks]"]

[dependency-groups]
demo = ["jupyterlab>=4.4,<5", "nbconvert>=7.16,<8"]
gpu = [
    "torch>=2.8,<3; python_version < '3.15' and (sys_platform == 'linux' or sys_platform == 'win32')",
]
dev = [
    {include-group = "demo"},
    {include-group = "docs"},
    {include-group = "lint"},
    {include-group = "pre-commit"},
    {include-group = "test"},
    {include-group = "tox"},
    {include-group = "utils"},
]
docs = [
    "mike>=2.1",
    "mkdocs>=1.6,<2",
    "mkdocs-autorefs>=1.4",
    "mkdocs-jupyter>=0.24.6",
    "mkdocs-material>=9.6",
    "mkdocs-simple-hooks>=0.1.5",
    "pymdown-extensions>=10.14",
    "pyyaml>=6",
    "regex>=2024.11.6",
]
lint = ["databricks-sdk", "ruff>=0.11", "ty>=0.0.1"]
pre-commit = ["pre-commit>=4.2", "pre-commit-uv>=4.1"]
test = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "pytest-mock>=3.14",
    "ipython>=8.20",
    "nbmake>=1.5.3",
]
tox = ["tox>=4.25", "tox-uv>=1.25"]
utils = ["rust-just>=1.40"]

[project.urls]
Documentation = "https://tvdboom.github.io/linescope/"
Issues = "https://github.com/tvdboom/linescope/issues"
Repository = "https://github.com/tvdboom/linescope"

[project.scripts]
linescope = "linescope.cli:main"

[tool.uv.build-backend]
source-include = [
    "tests/**",
    "examples/**",
    "docs_sources/**",
    "images/**",
    "tox.ini",
    "mkdocs.yml",
    "uv.lock",
]

[tool.uv.sources]
torch = {index = "pytorch-cu128"}

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 99
indent-width = 4
show-fixes = true
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "I",  # isort
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "D",  # Missing docstring in public function
    "UP",  # pyupgrade
    "YTT",  # flake8-2020
    "BLE",  # blind-except
    "FBT",  # boolean-trap
    "B",  # bugbear
    "A",  # builtins
    "COM",  # commas
    "C4",  # flake8-comprehensions
    "T10",  # debugger
    "ISC",  # implici-str-concat
    "ICN",  # import-conventions
    "G",  # flake8-logging-format
    "INP",  # no-pep420
    "PIE",  # flake8-pie
    "T20",  # print
    "PYI",  # pyi
    "PT",  # flake8-pytest-style
    "Q",  # quotes
    "RSE",  # raise
    "TID",  # tidy-imports
    "ARG",  # flake8-unused-arguments
    "ERA",  # commented-code
    "PD",  # pandas-vet
    "PGH",  # pygrep
    "FLY",  # flynt
    "NPY",  # numpy-specific-rules
    "PERF",  # performance checks
    "RUF",  # ruff specific rules
]
ignore = [
    "COM812",  # Trailing comma — conflicts with the ruff formatter
    "E731",  # Do not use a lambda expression
]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # Missing docstring in public function
"examples/**" = [
    "D",  # Missing docstring in public function
    "T201",  # Use print statement
]
"docs_sources/examples/notebooks/**" = ["T201"]  # Use print statement
"docs_sources/scripts/autodocs.py" = [
    "D",  # Missing docstring in public function
    "E731",  # Do not use a lambda expression
    "B",  # bugbear
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.environment]
root = ["./src"]

[tool.ty.src]
include = ["src/linescope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "spark: optional integration tests requiring local Spark and Java",
    "scalene: optional integration tests requiring the Scalene backend",
    "databricks: manual checks requiring a real Databricks workspace",
]

[tool.coverage.run]
source = ["linescope"]
branch = true

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@(abc\\.)?abstractmethod"]
