[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "linescope"
version = "0.1.0"
description = "An IDE-like Python source profiler for your code, notebooks, and Spark"
authors = [{name = "Mavs", email = "m.524687@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["profiling", "source", "notebooks", "spark", "scalene"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
scalene = ["scalene>=2.3,<2.4"]
notebook = ["ipython>=8.20", "ipykernel>=6.29"]
spark = ["pyspark>=3.5,<5"]
full = ["linescope[scalene,notebook,spark]"]

[dependency-groups]
dev = [
    {include-group = "docs"},
    {include-group = "lint"},
    {include-group = "pre-commit"},
    {include-group = "test"},
    {include-group = "tox"},
]
docs = [
    "click>=8.1", "mike>=2.1", "mkdocs>=1.6,<2",
    "mkdocs-autorefs>=1.4", "mkdocs-material>=9.6",
    "mkdocs-simple-hooks>=0.1.5", "pymdown-extensions>=10.14",
    "pyyaml>=6", "regex>=2024.11.6",
]
lint = ["ruff>=0.11", "ty>=0.0.1"]
pre-commit = ["pre-commit>=4.2", "pre-commit-uv>=4.1"]
test = ["pytest>=8.3", "pytest-cov>=6", "pytest-mock>=3.14", "ipython>=8.20"]
tox = ["tox>=4.25", "tox-uv>=1.25"]
utils = ["rust-just>=1.40"]

[project.urls]
Documentation = "https://tvdboom.github.io/linescope/"
Issues = "https://github.com/tvdboom/linescope/issues"
Repository = "https://github.com/tvdboom/linescope"

[project.scripts]
linescope = "linescope.cli:main"

[tool.uv]
required-version = ">=0.8"

[tool.hatch.build.targets.wheel]
packages = ["src/linescope"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "docs_sources/", "images/", "README.md", "LICENSE", "pyproject.toml", "tox.ini", "mkdocs.yml", "uv.lock"]

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 99
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]
"test.py" = ["D"]
"docs_sources/scripts/autodocs.py" = ["D", "E731", "B"]

[tool.ty.environment]
root = ["./src"]

[tool.ty.src]
include = ["src/linescope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "spark: optional integration tests requiring local Spark and Java",
    "scalene: optional integration tests requiring the Scalene backend",
    "databricks: manual checks requiring a real Databricks workspace",
]

[tool.coverage.run]
source = ["linescope"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@(abc\\.)?abstractmethod"]
