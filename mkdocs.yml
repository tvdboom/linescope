site_name: LineScope
site_author: Mavs
site_description: Your code, in the spotlight. Source profiling for Python, notebooks, and Spark.
site_url: https://tvdboom.github.io/linescope/
repo_name: tvdboom/linescope
repo_url: https://github.com/tvdboom/linescope
edit_uri: edit/main/docs_sources/
docs_dir: docs_sources
site_dir: docs
copyright: Copyright &copy; 2026, by Mavs.

theme:
  name: material
  logo: img/logo.png
  favicon: img/logo.png
  custom_dir: docs_sources/overrides
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tvdboom/linescope
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/linescope/

plugins:
  - search
  - autorefs
  - mkdocs-simple-hooks:
      hooks:
        on_page_markdown: docs_sources.scripts:render
        on_page_content: docs_sources.scripts:corrections
        on_post_build: docs_sources.scripts:clean_search

markdown_extensions:
  - admonition
  - md_in_html
  - def_list
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: pycon
          class: pycon
          format: !!python/name:docs_sources.scripts.formatter
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
      linenums: true
      linenums_style: pymdownx-inline

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - About: about.md
  - Getting started: getting_started.md
  - User guide:
      - Introduction: user_guide/introduction.md
      - Configuration: user_guide/configuration.md
      - Profiling Python: user_guide/python.md
      - Reading reports: user_guide/reports.md
      - Backends and measurement: user_guide/backends.md
      - Memory: user_guide/memory.md
      - Jupyter notebooks: user_guide/notebooks.md
      - Databricks: user_guide/databricks.md
      - Spark: user_guide/spark.md
      - Source and navigation: user_guide/source.md
  - CLI:
      - Scripts: cli/scripts.md
      - Modules: cli/modules.md
      - Options: cli/options.md
  - API:
      - Overview: api/index.md
      - Profiling: api/profiling.md
      - Configuration: api/configuration.md
      - Data model: api/model.md
      - Source and symbols: api/source.md
      - Backends: api/backends.md
      - Notebook integrations: api/notebooks.md
      - Spark integrations: api/spark.md
  - Examples:
      - Python script: examples/script.md
      - Package profiling: examples/package.md
      - Notebook session: examples/notebook.md
      - Databricks notebooks: examples/databricks.md
      - Local Spark: examples/spark.md
      - Custom backend: examples/backend.md
  - Development:
      - Contributing: contributing.md
      - Architecture: development/architecture.md
      - Testing: development/testing.md
      - Documentation: development/documentation.md
      - Releasing: development/releasing.md
  - FAQ: faq.md
  - Dependencies: dependencies.md
  - License: license.md
