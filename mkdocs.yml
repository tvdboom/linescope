site_name: LineScope
site_author: Mavs
site_description: Your code, in the spotlight. Source profiling for Python, notebooks, and Spark.
site_url: https://tvdboom.github.io/linescope/
repo_name: tvdboom/linescope
repo_url: https://github.com/tvdboom/linescope
edit_uri: edit/main/docs_sources/
docs_dir: docs_sources
site_dir: docs
copyright: Copyright &copy; 2026, by Mavs.

theme:
  name: material
  logo: img/icon.svg
  favicon: img/icon.svg
  custom_dir: docs_sources/overrides
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tvdboom/linescope
      name: GitHub
    - icon: fontawesome/brands/stack-overflow
      link: https://stackoverflow.com/questions/tagged/linescope
      name: StackOverflow
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/linescope/
      name: Pypi
    - icon: fontawesome/brands/medium
      link: https://tvdboom.medium.com/
      name: Medium
    - icon: fontawesome/solid/envelope
      link: mailto:m.524687@gmail.com
      name: Email

plugins:
  - search
  - autorefs
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      include_requirejs: true
      include_source: true
      ignore_h1_titles: true
      execute: false
  - mkdocs-simple-hooks:
      hooks:
        on_page_markdown: docs_sources.scripts:render
        on_page_content: docs_sources.scripts:corrections
        on_post_build: docs_sources.scripts:clean_search

markdown_extensions:
  - admonition
  - md_in_html
  - def_list
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: pycon
          class: pycon
          format: !!python/name:docs_sources.scripts.formatter
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
      linenums: true
      linenums_style: pymdownx-inline

extra_css:
  - stylesheets/extra.css

nav:
