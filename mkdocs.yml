site_name: LineScope
site_author: Mavs
site_description: Your code, in the spotlight. Source profiling for Python, notebooks, and Spark.
site_url: https://tvdboom.github.io/linescope/
repo_name: tvdboom/linescope
repo_url: https://github.com/tvdboom/linescope
edit_uri: edit/main/docs_sources/
docs_dir: docs_sources
site_dir: docs
copyright: Copyright &copy; 2026, by Mavs.

theme:
  name: material
  logo: img/icon.svg
  favicon: img/icon.svg
  custom_dir: docs_sources/overrides
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tvdboom/linescope
      name: GitHub
    - icon: fontawesome/brands/stack-overflow
      link: https://stackoverflow.com/questions/tagged/linescope
      name: StackOverflow
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/linescope/
      name: Pypi
    - icon: fontawesome/solid/envelope
      link: mailto:m.524687@gmail.com
      name: Email

plugins:
  - search
  - autorefs
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      include_requirejs: true
      include_source: true
      ignore_h1_titles: true
      no_prompt: true
      execute: true
      execute_ignore: ["gpu_example.ipynb"]
      allow_errors: false
      kernel_name: python3
      cache: false
  - mkdocs-simple-hooks:
      hooks:
        on_files: docs_sources.scripts:prepare_notebooks
        on_page_markdown: docs_sources.scripts:render
        on_page_content: docs_sources.scripts:corrections
        on_post_build: docs_sources.scripts:finish_build
        on_build_error: docs_sources.scripts:cleanup_notebooks

markdown_extensions:
  - admonition
  - md_in_html
  - def_list
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: pycon
          class: pycon
          format: !!python/name:docs_sources.scripts.formatter
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
      linenums: true
      linenums_style: pymdownx-inline

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - About: about.md
  - Getting started: getting_started.md
  - User guide:
      - Introduction: user_guide/introduction.md
      - Configuration: user_guide/configuration.md
      - Backends: user_guide/backends.md
      - Notebooks: user_guide/notebooks.md
      - Spark: user_guide/spark.md
      - GPU: user_guide/gpu.md
      - Reports: user_guide/reports.md
  - CLI:
      - linescope: cli/linescope.md
  - API:
      - Profiling:
          - profile: api/profiling/profile.md
          - profiler: api/profiling/profiler.md
          - ProfileController: api/profiling/profilecontroller.md
          - Session: api/profiling/session.md
      - Configuration:
          - Config: api/configuration/config.md
      - Data models:
          - Results:
              - ProfileResult: api/model/results/profileresult.md
              - ProfileRun: api/model/results/profilerun.md
          - Measurements:
              - BackendCapabilities: api/model/measurements/backendcapabilities.md
              - LineStats: api/model/measurements/linestats.md
              - FunctionStats: api/model/measurements/functionstats.md
          - Memory and GPU measurements:
              - MemoryStats: api/model/memory/memorystats.md
              - ProcessMemoryStats: api/model/memory/processmemorystats.md
              - MemorySample: api/model/memory/memorysample.md
              - GPUStats: api/model/memory/gpustats.md
          - Source snapshots:
              - SourceUnit: api/model/source/sourceunit.md
              - SourceLocation: api/model/source/sourcelocation.md
              - SymbolDefinition: api/model/source/symboldefinition.md
              - SymbolRef: api/model/source/symbolref.md
          - Spark executions:
              - SparkExecution: api/model/spark/sparkexecution.md
              - SparkExecutionStats: api/model/spark/sparkexecutionstats.md
              - SparkOperator: api/model/spark/sparkoperator.md
          - Options and states:
              - Backend: api/model/options/backend.md
              - DisplayMode: api/model/options/displaymode.md
              - SessionState: api/model/options/sessionstate.md
              - RunStatus: api/model/options/runstatus.md
              - SourceKind: api/model/options/sourcekind.md
              - SymbolKind: api/model/options/symbolkind.md
              - NotebookCollection: api/model/options/notebookcollection.md
      - Backend registration:
          - register_backend: api/backends/register_backend.md
          - ProfilerBackend: api/backends/profilerbackend.md
          - RawBackendResult: api/backends/rawbackendresult.md
          - RawLine: api/backends/rawline.md
  - Examples:
      - Quick Start: examples/notebooks/notebook_example.ipynb
      - Local Spark: examples/notebooks/spark_example.ipynb
      - GPU workload: examples/notebooks/gpu_example.ipynb
  - Development: development.md
  - FAQ: faq.md
  - Dependencies: dependencies.md
  - License: license.md
